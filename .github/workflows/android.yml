name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mochi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-apk
          path: Mochi.apk

      # Publishes a downloadable APK at
      # https://github.com/<owner>/<repo>/releases/latest/download/Mochi.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mochi-latest --cleanup-tag --yes || true
          gh release create mochi-latest Mochi.apk \
            --target "$GITHUB_SHA" \
            --title "Mochi (latest build)" \
            --notes "Download **Mochi.apk** on your Android phone and open it to install. You may need to allow installing apps from your browser."
